<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <title>Gut Run</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1e49; overscroll-behavior: none; }
    canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

    /* Nothing may stick out of the screen, or iOS Safari zooms the whole page out to fit it. */
    .screen { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; pointer-events: none; }

    /* DOM on top of the canvas, same 360x640 coordinates as the design. */
    .stage { position: absolute; left: 0; top: 0; width: 360px; height: 640px; transform-origin: 0 0; pointer-events: none; visibility: hidden; }
    .stage.is-ready { visibility: visible; }
    button { padding: 0; border: 0; background: none; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    button img { display: block; width: 100%; height: 100%; }

    .mute { position: absolute; z-index: 2; left: calc(var(--side, 0px) + 320px); top: 11px; width: 36px; height: 36px; color: #0b1e49; }
    .mute svg { display: block; width: 20px; height: 20px; margin: auto; }
    .mute .off { display: none; }
    .mute[aria-pressed="true"] .on { display: none; }
    .mute[aria-pressed="true"] .off { display: inline; }
    .mute:focus-visible { outline-color: #0b1e49; outline-offset: -2px; }

    /* The endcard starts under the logo bar and reaches every edge of the ad. */
    .endcard { position: absolute; left: calc(var(--side, 0px) * -1); right: calc(var(--side, 0px) * -1); top: 58px; bottom: calc(var(--below, 0px) * -1); background: #0b1e49; visibility: hidden; pointer-events: auto; overflow: hidden; }
    .layers { position: absolute; left: var(--side, 0px); top: -58px; width: 360px; height: 640px; }
    .layers > img { position: absolute; left: 0; top: 0; width: 360px; height: 640px; }
    .layers > button { position: absolute; }

    /* Origins are the centres of the drawn areas inside the full-size layers. */
    #endcard-fail .bubble { transform-origin: 179.75px 235.25px; }
    #endcard-win .bubble { transform-origin: 179.75px 245.25px; }
    #endcard-fail .poo { transform-origin: 180px 241px; }
    #endcard-win .poo { transform-origin: 179.75px 365px; }
    #endcard-win .confetti { transform-origin: 60px 130px; }
    .bacterium-1 { transform-origin: 144.5px 133.75px; }
    .bacterium-2 { transform-origin: 258px 215px; }
    .bacterium-3 { transform-origin: 87px 231px; }
    .bacterium-4 { transform-origin: 94.5px 148px; }
    .bacterium-5 { transform-origin: 221.5px 155px; }

    /* Measured on the design screens. */
    #endcard-fail .cta { left: 37px; top: 482.5px; width: 186px; height: 38.5px; }
    #endcard-fail .replay { left: 37px; top: 538.5px; width: 185.5px; height: 40.5px; }
    #endcard-win .cta { left: 27.5px; top: 560px; width: 214px; height: 45.5px; }
  </style>
</head>
<body>
  <canvas aria-label="Gut Run: tap to jump and guide the poo through the gut"></canvas>

  <div class="screen">
  <div class="stage">
    <button class="mute" type="button" aria-label="Ton aus" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        <path class="on" d="M15.5 8.5a5 5 0 0 1 0 7l1.4 1.4a7 7 0 0 0 0-9.8l-1.4 1.4zM18.3 5.7a9 9 0 0 1 0 12.6l1.4 1.4a11 11 0 0 0 0-15.4l-1.4 1.4z"/>
        <path class="off" d="M21.3 9.1 19.9 7.7 17.5 10.1 15.1 7.7 13.7 9.1l2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4-2.4-2.4z"/>
      </svg>
    </button>

    <section class="endcard" id="endcard-fail" aria-hidden="true">
      <div class="layers">
        <img class="bubble" src="./assets/02_endcard/fail/bubble.png" alt="">
        <img class="bacterium bacterium-1" src="./assets/02_endcard/fail/bac1.png" alt="">
        <img class="bacterium bacterium-2" src="./assets/02_endcard/fail/bac2.png" alt="">
        <img class="bacterium bacterium-3" src="./assets/02_endcard/fail/bac3.png" alt="">
        <img class="bacterium bacterium-4" src="./assets/02_endcard/fail/bac4.png" alt="">
        <img class="bacterium bacterium-5" src="./assets/02_endcard/fail/bac5.png" alt="">
        <img class="poo" src="./assets/02_endcard/fail/sad.png" alt="">
        <img class="headline" src="./assets/02_endcard/fail/hl.png" alt="Poo, das tat weh! Erfahre jetzt, was deinem Darm guttut.">
        <button class="cta" type="button"><img src="./assets/02_endcard/fail/cta.png" alt="Jetzt informieren!"></button>
        <button class="replay" type="button"><img src="./assets/02_endcard/fail/replay.png" alt="Nochmal spielen"></button>
      </div>
    </section>

    <section class="endcard" id="endcard-win" aria-hidden="true">
      <div class="layers">
        <img class="bubble" src="./assets/02_endcard/win/bubble.png" alt="">
        <img class="poo" src="./assets/02_endcard/win/happy.png" alt="">
        <img class="confetti" src="./assets/02_endcard/win/konfetti.png" alt="">
        <img class="headline" src="./assets/02_endcard/win/hl.png" alt="Poo, tut das gut! Wenn du weißt, was dein Darm braucht.">
        <button class="cta" type="button"><img src="./assets/02_endcard/win/cta.png" alt="Jetzt mehr erfahren"></button>
      </div>
    </section>
  </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
